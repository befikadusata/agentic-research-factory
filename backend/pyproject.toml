[project]
name = "agentic-research-factory-backend"
version = "0.1.0"
description = "FastAPI backend for Agentic Research Factory"
requires-python = ">=3.11"
dependencies = [
  # Some deps import pkg_resources at runtime without declaring setuptools;
  # the slim Docker image doesn't seed it (the uv dev venv does), so pin it.
  "setuptools==81.0.0",
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "python-dotenv==1.0.1",
  "pydantic-settings==2.5.2",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.13.3",
  "crewai>=0.83.0",
  "crewai-tools==0.14.0",
  "PyJWT==2.9.0",
  "tavily-python==0.5.0",
  "firecrawl-py==1.5.0",
  "llama-parse==0.5.14",
  "litellm>=1.60.0",
  "sse-starlette==2.1.3",
  "python-multipart==0.0.12",
  "weasyprint==62.3",
  # pydyf 0.12.x refactored Stream and breaks weasyprint 62.3's write_pdf
  # (AttributeError: 'super' object has no attribute 'transform'). Pin to 0.11.x.
  "pydyf==0.11.0",
  "markdown==3.7",
  "httpx==0.27.0",
  # S3-compatible client for uploaded-PDF storage (MinIO locally, S3/R2/Spaces
  # when hosted) — see services/storage_service.py.
  "boto3==1.35.36",
  "vecs==0.4.3",
  "sentence-transformers==3.0.1",
  # Declared directly ONLY so the CPU-index pin below applies — uv resolves
  # [tool.uv.sources] against direct dependencies, not transitive ones, and both
  # of these arrive via docling and sentence-transformers. Versions match what
  # those packages already resolved to, so the rest of the graph is unchanged.
  "torch==2.12.0",
  "torchvision==0.27.0",
  "langgraph>=0.2.35",
  "structlog==24.4.0",
  "tenacity==9.0.0",
  "langchain-core>=0.3.29",
  "redis>=7.4.0",
  "prometheus-fastapi-instrumentator>=7.1.0",
  "celery>=5.6.3",
  "langchain-text-splitters>=0.3.11",
  "docling>=2.0.0",
  "langfuse>=4.12.0",
  "nest-asyncio>=1.6.0",
]

# torch arrives transitively via docling -> accelerate (and sentence-transformers),
# and the default PyPI wheel bundles the full CUDA runtime: ~2.2 GB of nvidia-*
# and triton wheels. Nothing here ever runs on a GPU — Docling's layout models
# and the MiniLM embedder/cross-encoder in tools/rag.py are all CPU inference —
# so that payload is pure image weight. Pin torch to PyTorch's CPU-only index.
# `explicit = true` keeps every other package resolving from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Both, not just torch: torchvision ships a compiled extension linked against
# libtorch, and PyPI's wheel is built for the default (CUDA) torch. Pairing it
# with the +cpu build fails at import with
# "operator torchvision::nms does not exist", which breaks Docling's layout
# models. The two must come from the same index.
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

# Test-only, so declared here rather than as runtime deps: the Dockerfile builds
# with `uv sync --no-dev` and CI with a plain `uv sync`, which includes this
# group. Only pytest-asyncio actually leaves the image — crewai-tools 0.14.0
# declares pytest as a runtime dependency, so it ships either way.
[dependency-groups]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
