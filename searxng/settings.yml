# Minimal override merged on top of SearXNG's built-in default settings.
# Full reference: https://docs.searxng.org/admin/settings/settings.html
use_default_settings: true

server:
  # No secret_key here on purpose: it comes from the SEARXNG_SECRET environment
  # variable (set in docker-compose.yml), which overrides the yml value. That
  # keeps a real secret out of git without the container having to rewrite this
  # tracked file at boot.
  #
  # The bot-detection limiter needs a Valkey/Redis backend to work; since this
  # instance is only called by our own backend (not exposed publicly), disable it.
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json
