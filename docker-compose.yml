services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: research_factory
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d research_factory"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Object storage for uploaded PDFs. The API receives the file and a Celery
  # worker parses it later, in a different container — so the bytes must live
  # somewhere both can reach. They used to go to a container-local /tmp, which
  # meant the worker never found them and every upload failed as "no text could
  # be extracted". Any S3-compatible store is a drop-in replacement in a hosted
  # deployment; nothing here is MinIO-specific beyond the endpoint and keys.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      # Local-only defaults, matching the STORAGE_* values passed to the backend
      # and worker below. Override all four together for anything shared.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console — browse uploaded objects at localhost:9001
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: ./backend
    command: alembic upgrade head
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/research_factory
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    # The same source mount backend/celery/beat get. Without it, a plain
    # `docker compose up` (no --build) ran migrations from the image's baked-in
    # copy while the API served the mounted source: a new revision was invisible
    # here, migrate re-ran the old head, service_completed_successfully passed,
    # and the API booted against a schema missing the new column.
    volumes:
      - ./backend:/app

  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/research_factory
      - REDIS_URL=redis://redis:6379/0
      - SEARXNG_URL=http://searxng:8080
      - FIRECRAWL_API_URL=http://firecrawl-api:3002
      # Uploaded PDFs go to MinIO, not a container-local path — the celery
      # service below gets the identical four values, which is the whole point:
      # both containers must resolve an upload to the same bytes.
      - STORAGE_BACKEND=s3
      - STORAGE_ENDPOINT_URL=http://minio:9000
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      searxng:
        condition: service_healthy
      minio:
        condition: service_healthy
      # NOTE: no firecrawl-api dependency — scraping is optional (behind the
      # "scraping" profile) and the scraper degrades gracefully when it's down,
      # so the app must not block startup on the heavy Firecrawl stack.
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    build: ./backend
    # -Q default: celery_app routes execute_run_task/ingest_doc_task to the
    # "default" queue, so the worker must consume it (not just the "celery" one).
    # --concurrency=1: runs still serialize, but HITL waits no longer hold a
    # worker (each task runs one segment and returns; a paused run occupies no
    # slot), so a human idling at an approval no longer blocks every other run.
    # Raise this once off the shared Groq free-tier rate limit — parallel LLM
    # calls would otherwise blow the 12K tokens/min ceiling.
    command: celery -A celery_app worker --loglevel=info --concurrency=1 -Q default
    env_file: ./backend/.env
    environment:
      # The `celery` CLI puts its own bin dir on sys.path (not /app), so the
      # task's `from services…` import fails without this.
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/research_factory
      - REDIS_URL=redis://redis:6379/0
      - SEARXNG_URL=http://searxng:8080
      - FIRECRAWL_API_URL=http://firecrawl-api:3002
      # Identical to the backend's — the worker reads back exactly what the API
      # wrote, so these four must never drift apart.
      - STORAGE_BACKEND=s3
      - STORAGE_ENDPOINT_URL=http://minio:9000
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
      minio:
        condition: service_healthy
      # No firecrawl-api dependency — see the backend service note above.
    volumes:
      - ./backend:/app

  # Celery-beat scheduler: fires dispatch_due_monitors_task every 60s so due
  # monitors spawn runs. Runs as its own process (beat must be a singleton —
  # never scale this to >1 replica or monitors would double-fire).
  beat:
    build: ./backend
    command: celery -A celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file: ./backend/.env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/research_factory
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # --- Self-hosted web search (Tavily alternative) ---
  searxng:
    image: searxng/searxng:latest
    # Published only so a human can open the search UI — the backend and worker
    # reach it over the compose network as http://searxng:8080 either way. Host
    # port is overridable because 8081 is a popular default: when it is already
    # taken, `docker compose up` fails to bind and leaves searxng off the
    # network entirely, at which point every web_search call in every run
    # returns the "temporarily unavailable" degradation and runs quietly
    # research with no sources. Export SEARXNG_HOST_PORT to move it.
    ports:
      - "${SEARXNG_HOST_PORT:-8081}:8080"
    # Mount the single file read-only, NOT `./searxng:/etc/searxng:rw`. The
    # image entrypoint runs `chown -R searxng:searxng` on whatever directory is
    # mounted at /etc/searxng (its FORCE_OWNERSHIP defaults to true), and with a
    # root Docker daemon that reached through the bind mount and left the
    # tracked host directory owned by uid 977 — after which `git checkout --
    # searxng/settings.yml` failed with "unable to unlink". Mounting the file
    # alone keeps the host directory out of the container's reach (/etc/searxng
    # is then the image's own dir, already searxng-owned, so nothing is
    # chowned), and :ro stops the container rewriting tracked content.
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/
      # SearXNG reads server.secret_key from this env var and it takes
      # precedence over the yml (searx/settings_defaults.py), so no real secret
      # need be committed and nothing has to be rewritten on disk at boot. This
      # instance is local-only and not publicly exposed; export SEARXNG_SECRET
      # in your shell to override.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-local-dev-searxng-secret-not-for-production}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --- Self-hosted scraping (Firecrawl alternative) ---
  # Opt-in: this is a heavy 5-container stack (api, redis, rabbitmq, postgres,
  # playwright) that a plain `docker compose up` skips. Enable it only when you
  # need web scraping:  docker compose --profile scraping up
  firecrawl-redis:
    profiles: ["scraping"]
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  firecrawl-rabbitmq:
    profiles: ["scraping"]
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  firecrawl-postgres:
    profiles: ["scraping"]
    image: ghcr.io/firecrawl/nuq-postgres:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - firecrawl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  firecrawl-playwright:
    profiles: ["scraping"]
    image: ghcr.io/firecrawl/playwright-service:latest
    environment:
      - PORT=3000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  firecrawl-api:
    profiles: ["scraping"]
    image: ghcr.io/firecrawl/firecrawl:latest
    environment:
      - HOST=0.0.0.0
      - PORT=3002
      - REDIS_URL=redis://firecrawl-redis:6379
      - REDIS_RATE_LIMIT_URL=redis://firecrawl-redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://firecrawl-playwright:3000/scrape
      - NUQ_RABBITMQ_URL=amqp://firecrawl-rabbitmq:5672
      - POSTGRES_HOST=firecrawl-postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      # No cloud account needed — self-hosted mode skips API-key auth entirely.
      - USE_DB_AUTHENTICATION=false
      - BULL_AUTH_KEY=self-hosted-local-key
      - TEST_API_KEY=self-hosted-local-key
    ports:
      - "3002:3002"
    depends_on:
      firecrawl-redis:
        condition: service_healthy
      firecrawl-rabbitmq:
        condition: service_healthy
      firecrawl-playwright:
        condition: service_healthy
      firecrawl-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/v0/health/liveness"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev
    environment:
      # Copy values from frontend/.env.local.example
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=test-secret-at-least-32-chars-long-for-e2e
      - GOOGLE_CLIENT_ID=replace-with-google-client-id
      - GOOGLE_CLIENT_SECRET=replace-with-google-client-secret
      # NEXT_PUBLIC_* is inlined into the BROWSER bundle, so this must be a
      # host-reachable URL (the published port), not the internal "backend"
      # hostname the browser can't resolve.
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
      # NextAuth runs inside this container and must use Docker DNS to reach the API.
      - BACKEND_INTERNAL_URL=http://backend:8000
      # Must match the backend's BACKEND_JWT_SECRET or the JWT that
      # /api/backend-token mints is rejected: the stack boots healthy, login
      # succeeds, and every authenticated request 401s with nothing pointing at
      # the cause. backend/.env.example and frontend/.env.local.example ship
      # this same throwaway value so a fresh clone needs no edits. Rotating it
      # means changing all three together (the backend reads its own
      # ./backend/.env via env_file, so it cannot inherit this one).
      - BACKEND_JWT_SECRET=dummy-secret
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # Keep container-generated build artifacts out of the host bind mount.
      # Rootless Docker may otherwise create host files owned by nobody:nogroup,
      # which prevents local Next.js and Playwright processes from cleaning them.
      - frontend_next:/app/.next

volumes:
  pgdata:
  miniodata:
  firecrawl_pgdata:
  frontend_next:
