services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: research_factory
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d research_factory"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    command: alembic upgrade head
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/research_factory
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/research_factory
      - REDIS_URL=redis://redis:6379/0
      - SEARXNG_URL=http://searxng:8080
      - FIRECRAWL_API_URL=http://firecrawl-api:3002
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      searxng:
        condition: service_healthy
      # NOTE: no firecrawl-api dependency — scraping is optional (behind the
      # "scraping" profile) and the scraper degrades gracefully when it's down,
      # so the app must not block startup on the heavy Firecrawl stack.
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    build: ./backend
    # -Q default: celery_app routes execute_run_task/ingest_doc_task to the
    # "default" queue, so the worker must consume it (not just the "celery" one).
    # --concurrency=1: runs still serialize, but HITL waits no longer hold a
    # worker (each task runs one segment and returns; a paused run occupies no
    # slot), so a human idling at an approval no longer blocks every other run.
    # Raise this once off the shared Groq free-tier rate limit — parallel LLM
    # calls would otherwise blow the 12K tokens/min ceiling.
    command: celery -A celery_app worker --loglevel=info --concurrency=1 -Q default
    env_file: ./backend/.env
    environment:
      # The `celery` CLI puts its own bin dir on sys.path (not /app), so the
      # task's `from services…` import fails without this.
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/research_factory
      - REDIS_URL=redis://redis:6379/0
      - SEARXNG_URL=http://searxng:8080
      - FIRECRAWL_API_URL=http://firecrawl-api:3002
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
      # No firecrawl-api dependency — see the backend service note above.
    volumes:
      - ./backend:/app

  # Celery-beat scheduler: fires dispatch_due_monitors_task every 60s so due
  # monitors spawn runs. Runs as its own process (beat must be a singleton —
  # never scale this to >1 replica or monitors would double-fire).
  beat:
    build: ./backend
    command: celery -A celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file: ./backend/.env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/research_factory
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # --- Self-hosted web search (Tavily alternative) ---
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8081:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/
    # settings.yml ships with a placeholder secret_key so no real secret is
    # committed to git; generate a real one in-place on first boot, then hand
    # off to the image's own entrypoint.
    entrypoint: >
      sh -c "
        if grep -q ultrasecretkey /etc/searxng/settings.yml; then
          sed -i \"s/ultrasecretkey/$$(openssl rand -hex 32)/\" /etc/searxng/settings.yml;
        fi;
        exec /usr/local/searxng/entrypoint.sh
      "
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --- Self-hosted scraping (Firecrawl alternative) ---
  # Opt-in: this is a heavy 5-container stack (api, redis, rabbitmq, postgres,
  # playwright) that a plain `docker compose up` skips. Enable it only when you
  # need web scraping:  docker compose --profile scraping up
  firecrawl-redis:
    profiles: ["scraping"]
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  firecrawl-rabbitmq:
    profiles: ["scraping"]
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  firecrawl-postgres:
    profiles: ["scraping"]
    image: ghcr.io/firecrawl/nuq-postgres:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - firecrawl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  firecrawl-playwright:
    profiles: ["scraping"]
    image: ghcr.io/firecrawl/playwright-service:latest
    environment:
      - PORT=3000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  firecrawl-api:
    profiles: ["scraping"]
    image: ghcr.io/firecrawl/firecrawl:latest
    environment:
      - HOST=0.0.0.0
      - PORT=3002
      - REDIS_URL=redis://firecrawl-redis:6379
      - REDIS_RATE_LIMIT_URL=redis://firecrawl-redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://firecrawl-playwright:3000/scrape
      - NUQ_RABBITMQ_URL=amqp://firecrawl-rabbitmq:5672
      - POSTGRES_HOST=firecrawl-postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      # No cloud account needed — self-hosted mode skips API-key auth entirely.
      - USE_DB_AUTHENTICATION=false
      - BULL_AUTH_KEY=self-hosted-local-key
      - TEST_API_KEY=self-hosted-local-key
    ports:
      - "3002:3002"
    depends_on:
      firecrawl-redis:
        condition: service_healthy
      firecrawl-rabbitmq:
        condition: service_healthy
      firecrawl-playwright:
        condition: service_healthy
      firecrawl-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/v0/health/liveness"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev
    environment:
      # Copy values from frontend/.env.local.example
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=test-secret-at-least-32-chars-long-for-e2e
      - GOOGLE_CLIENT_ID=replace-with-google-client-id
      - GOOGLE_CLIENT_SECRET=replace-with-google-client-secret
      # NEXT_PUBLIC_* is inlined into the BROWSER bundle, so this must be a
      # host-reachable URL (the published port), not the internal "backend"
      # hostname the browser can't resolve.
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
      # Must match the backend's BACKEND_JWT_SECRET (backend/.env = dummy-secret)
      # or the JWT that /api/backend-token mints is rejected with 401.
      - BACKEND_JWT_SECRET=dummy-secret
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # Keep container-generated build artifacts out of the host bind mount.
      # Rootless Docker may otherwise create host files owned by nobody:nogroup,
      # which prevents local Next.js and Playwright processes from cleaning them.
      - frontend_next:/app/.next

volumes:
  pgdata:
  firecrawl_pgdata:
  frontend_next:
