name: Model evals

# The RAG quality evals, which ci.yml does not run: it invokes a bare
# `uv run pytest`, and these 16 tests skip themselves unless RUN_MODEL_EVALS is
# set. They are separated from ci.yml rather than added as a job to it because
# they need their own triggers — a nightly schedule and a path filter — and
# putting a `schedule` on ci.yml would drag the lint, e2e and image-build jobs
# into every nightly run for nothing.
#
# The cost that shapes this file. A cold run embeds the corpus and 72 queries
# per variant against the live API: roughly 270 requests, against a Gemini free
# tier of 1000 embed requests per day (quota
# EmbedContentRequestsPerDayPerUserPerProjectPerModel-FreeTier), shared with
# whatever local development spends on the same key. Measured rather than
# assumed — read off the 429 body after exhausting it.
#
# So the embedding cache is carried between runs (see the cache steps below),
# taking the steady-state cost to near zero: the corpus and the eval queries are
# fixed strings, so after one warm-up run there is almost nothing left to embed.
# Only a change to the corpus, the chunking or the model pays again.
#
# Nightly and manual only, deliberately, even though the cache makes a
# path-filtered `pull_request` trigger affordable in principle — a pull request
# can restore the cache the nightly run saved on main, so it would usually cost
# nothing. That is worth enabling once a nightly run has demonstrated the cache
# working end to end, and not before: if the cache silently fails to restore,
# every trigger becomes a 270-request cold run and the day's budget is gone by
# mid-morning. The paths filter to reinstate when that is proven:
# backend/tools/rag.py, backend/evals/**, backend/config.py, and the two eval
# test files.

on:
  workflow_dispatch:
  schedule:
    # 03:00 UTC daily. Nothing depends on the hour beyond it being off-peak.
    - cron: "0 3 * * *"

# A second push to the same branch supersedes the first. These runs cost real
# API quota, so paying for a result nobody will read is worse than usual.
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrieval-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: research_factory_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Redis is NOT a service container — it is started by hand below so its
      # data directory can be carried between runs. See the cache steps.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # Pinned to a full version, unlike the actions/* above: setup-uv stopped
      # publishing floating major and minor tags at v8, so `@v9` does not
      # resolve. Bumping this is a deliberate edit, not something a major tag
      # carries along.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # tools/rag.py loads all-MiniLM-L6-v2 and ms-marco-MiniLM-L-6-v2 from the
      # Hub on first use. Cached on the lockfile so a dependency bump that could
      # change how they are loaded re-downloads them.
      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('backend/uv.lock') }}

      # The embedding cache, carried between runs, is what keeps this job inside
      # the free tier. utils/embedding_cache.py keys entries on a SHA-256 of
      # (provider, model, dimension, text), so a restored entry can never be
      # stale in a way that matters: change the model or the corpus and the key
      # changes with it, missing the cache and re-embedding. That is the only
      # reason a cache this old is safe to trust.
      #
      # Caches are immutable, so the key carries run_id to always write a fresh
      # entry, and restore-keys picks up the most recent previous one. A pull
      # request can restore what the nightly run on main saved.
      - name: Restore embedding cache
        uses: actions/cache@v6
        with:
          path: /tmp/redis-data
          key: emb-cache-${{ github.run_id }}
          restore-keys: emb-cache-

      # Run as the runner's own uid. The redis image otherwise writes its data
      # directory as uid 999 mode 700, which the runner cannot read — the cache
      # save would fail and every run would silently be a cold one, which is the
      # exact failure this whole step exists to prevent. `--save ''` disables
      # the periodic snapshot; the explicit SAVE after the tests is what writes.
      - name: Start Redis on the restored cache
        run: |
          mkdir -p /tmp/redis-data
          docker run -d --name redis \
            --user "$(id -u):$(id -g)" \
            -p 6379:6379 \
            -v /tmp/redis-data:/data \
            redis:7 redis-server --dir /data --save ''
          # Via `docker exec` throughout: redis-cli is not guaranteed to be
          # installed on the runner image, but it is certainly in the container.
          for i in $(seq 1 30); do
            docker exec redis redis-cli ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done
          docker exec redis redis-cli ping | grep -q PONG || { echo "::error::Redis did not come up"; exit 1; }
          echo "embedding cache entries restored: $(docker exec redis redis-cli --scan --pattern 'emb:*' | wc -l)"

      # rag.py picks the embedding provider by whether GEMINI_API_KEY is set and
      # falls back to the local MiniLM embedder in silence when it is not. That
      # fallback retrieves measurably less: pool recall 0.935 against this
      # suite's 0.95 floor, where Gemini reaches 1.000. Without this guard a
      # missing secret would fail two tests with a message about retrieval
      # quality collapsing, which is not what went wrong.
      - name: Require the Gemini key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is not configured for this repository. These evals are calibrated on Gemini embeddings; tools/rag.py would silently fall back to the local MiniLM embedder and fail the recall floors for a reason that has nothing to do with the change under test."
            exit 1
          fi

      - name: Run migrations
        env:
          DATABASE_URL: "postgresql+asyncpg://user:password@localhost:5432/research_factory_test"
          BACKEND_JWT_SECRET: "test-secret"
        run: uv run alembic upgrade head

      - name: Run retrieval and rerank evals
        env:
          # The gate these 16 tests skip themselves behind.
          RUN_MODEL_EVALS: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: "postgresql+asyncpg://user:password@localhost:5432/research_factory_test"
          REDIS_URL: "redis://localhost:6379"
          # Same placeholders ci.yml uses: config.py requires them at import,
          # and no eval here reaches an LLM — the sub-queries are pinned so the
          # measured numbers cannot move with a model's mood.
          LLM_MODEL: "gpt-4o"
          LLM_API_KEY: "mock"
          TAVILY_API_KEY: "mock"
          FIRECRAWL_API_KEY: "mock"
          LLAMA_CLOUD_API_KEY: "mock"
          BACKEND_JWT_SECRET: "test-secret"
        # Running out of embedding quota mid-run does not look like running out
        # of quota. The corpus ingests partially, retrieval measures what little
        # made it in, and the suite fails on its recall floors — the exact
        # signature of the regression it is meant to detect. This distinguishes
        # the two, because reading it wrong costs an afternoon.
        #
        # There are two different 429s behind that, and saying "daily quota" for
        # both sends you to the wrong place: the per-minute cap is the suite
        # riding its own request rate and clears by itself, the per-day cap is
        # the budget genuinely gone until tomorrow. tools/rag.py reads the
        # quotaId off the body, so the distinction is in the log — report which
        # one rather than assuming.
        run: |
          set -o pipefail
          if ! uv run pytest tests/test_retrieval_eval.py tests/test_rerank_calibration.py -v 2>&1 | tee eval-output.txt; then
            if grep -q "PerDay" eval-output.txt; then
              echo "::error::Gemini's per-DAY embedding quota is exhausted, so retrieval quality was never measured. The free tier allows 1000 embed requests per day and one cold run costs roughly 270, shared with local development against the same key. It will not clear before tomorrow. This is NOT a retrieval regression — do not go looking for one."
            elif grep -qE "RESOURCE_EXHAUSTED|429 Too Many Requests" eval-output.txt; then
              echo "::error::Gemini rate-limited the embed calls and the retries did not outlast it, so retrieval quality was never measured. This is a per-minute cap, not the daily budget — re-running usually works. This is NOT a retrieval regression — do not go looking for one."
            fi
            exit 1
          fi

      # `always()`: a failed run still embedded things, and those vectors cost
      # quota. Discarding them would make the next run pay for them again — and
      # a run that died on quota is exactly the one whose partial work is worth
      # keeping. This must be the last step that touches Redis; actions/cache
      # uploads /tmp/redis-data in its post-job hook, after everything here.
      - name: Persist the embedding cache
        if: always()
        run: |
          if docker ps --format '{{.Names}}' | grep -q '^redis$'; then
            docker exec redis redis-cli SAVE
            echo "embedding cache entries saved: $(docker exec redis redis-cli --scan --pattern 'emb:*' | wc -l)"
          fi
